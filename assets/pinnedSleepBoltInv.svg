<!-- Inverted charging bolt: pinnedSleepBolt.svg with black and white swapped,
     same geometry, same viewBox, same layer order. Used by the BLACK bar style,
     where the battery icon's cells are white on a black strip — the outer white
     outline keeps the bolt off the black background, the black inner outline
     separates it from the white cells, and the white core carries the glyph.
     Keep the two files geometrically identical: both are sized by the same
     expressions in the qmd (0.62 x 1.3 of the percentage text height), so any
     divergence shows up as the bolt jumping when the style is flipped. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 32">
  <defs>
    <path id="b" transform="translate(10,16) scale(0.87) translate(-10,-16)"
          d="M11,0 L1,19.2 L8.4,19.2 L7,32 L19,12.2 L10.4,12.2 Z"/>
    <clipPath id="ends">
      <rect x="-2" y="-2" width="24" height="7"/>
      <rect x="-2" y="27" width="24" height="7"/>
    </clipPath>
  </defs>
  <use href="#b" clip-path="url(#ends)" fill="none" stroke="white"
       stroke-width="3.6" stroke-linejoin="round"/>
  <use href="#b" fill="none" stroke="black"
       stroke-width="2" stroke-linejoin="round"/>
  <use href="#b" fill="white"/>
</svg>
