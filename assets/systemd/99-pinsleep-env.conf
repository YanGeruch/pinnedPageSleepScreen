# pinnedPageSleepScreen: batterymanager's RTC-wake re-suspend delay
# ("Re-entering DeepSleep in Xms", stock 34000 — tuned to the 30s vpdd rail
# hold). With the sleep hook shrinking the hold to 3s, 8s covers the clock
# repaint + rail release with margin. Lives in xochitl's tmpfs drop-in dir
# next to the xovi conf — same lifecycle: gone on reboot, redeployed with xovi.
[Service]
Environment=UPKEEP_INTERVAL_MS=8000
