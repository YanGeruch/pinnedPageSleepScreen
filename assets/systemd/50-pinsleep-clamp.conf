# pinnedPageSleepScreen: w4clamp.so interposes timerfd_settime and clamps
# xochitl's 34s re-suspend arming to window.conf seconds (default 3; 3..33
# valid, anything else = stock passthrough; re-read per arming). Must be an
# LD_PRELOAD entry (dlopen'd extensions can't interpose), so this file wins
# over xovi's 00-xovi.conf lexically while keeping xovi.so first in the chain.
# Installed to /usr/lib/systemd/system/xochitl.service.d/ (rootfs): survives
# reboots (volatile /etc does not); an OTA wipes it together with the sleep
# hooks — same redeploy lifecycle.
[Service]
Environment="LD_PRELOAD=/home/root/xovi/xovi.so:/home/root/.pinnedSleepScreen/w4clamp.so"
